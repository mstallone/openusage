name: iOS TestFlight

# Called by release.yml in parallel with the macOS release. Keeping the complete TestFlight
# pipeline here gives testflight_gate.mjs a precise workflow path to track: changes to this file
# can require an end-to-end validation shipment, while unrelated macOS release edits cannot.
on:
  workflow_call:
    inputs:
      tag:
        description: "Stable release tag to build (for example, v0.8.9)"
        required: true
        type: string
      force_ios:
        description: "Ship even when the gate would skip"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Comma-separated external TestFlight group names every release ships to. The groups must already
# exist under TestFlight → External Testing. The gate and distribute jobs share this value so a
# build advances the baseline only after every configured external group receives it.
env:
  TESTFLIGHT_EXTERNAL_GROUPS: External

jobs:
  # Every tag is a new marketing version, so every upload triggers a fresh Beta App Review and a
  # no-op update for testers. Mac-only releases skip that. The gate ships when iOS-relevant paths
  # changed, the newest external build nears expiry, this is the first release, or force_ios is set.
  ios-gate:
    name: iOS Gate
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.gate.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # full history + tags so the gate can diff release baselines
          persist-credentials: false

      - name: Validate tag
        run: |
          "$GITHUB_WORKSPACE/script/validate_release_tag.sh" "${{ inputs.tag }}" >/dev/null

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Decide whether to ship iOS
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_IOS: ${{ inputs.force_ios && '1' || '' }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: node script/testflight_gate.mjs

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi

  # Independent of the macOS job on purpose: a TestFlight hiccup must not block the DMG/appcast,
  # and vice versa. iOS has no notarization; the App Store Connect upload is its equivalent.
  testflight:
    name: iOS TestFlight
    runs-on: macos-26
    needs: ios-gate
    if: needs.ios-gate.outputs.ship == 'true'
    env:
      APPLE_TEAM_ID: 8KZBNZJBAX
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # full history so the CFBundleVersion (commit count) is correct
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version and build
        id: meta
        run: |
          VERSION="$("$GITHUB_WORKSPACE/script/validate_release_tag.sh" "${{ inputs.tag }}")"
          {
            echo "version=$VERSION"
            # Resolve once so the upload and distribution poll cannot disagree about the build.
            echo "build=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_IOS_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          APPLE_IOS_WIDGET_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_WIDGET_APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_NOTARY_PRIVATE_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_IOS_APP_STORE_PROFILE \
            APPLE_IOS_WIDGET_APP_STORE_PROFILE
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      # Apple Distribution cert (.p12, base64) used to sign the iOS app. The temporary keychain is
      # cleaned up automatically by the action's post step.
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Write App Store provisioning profiles
        env:
          IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_IOS_WIDGET_APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/runway-ios-appstore.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE=$RUNNER_TEMP/runway-ios-appstore.mobileprovision" >> "$GITHUB_ENV"
          printf '%s' "$IOS_WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision"
          echo "IOS_WIDGET_PROVISIONING_PROFILE=$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and upload to TestFlight
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RUNWAY_VERSION: ${{ steps.meta.outputs.version }}
          RUNWAY_BUILD: ${{ steps.meta.outputs.build }}
        run: ./script/release_ios.sh

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/runway-ios-appstore.mobileprovision"
          rm -f "$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision"
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi

  # Wait for processing, attach the uploaded build to external groups, and submit it for Beta App
  # Review. This is separate because it is idempotent and safe to retry without repeating upload.
  distribute:
    name: TestFlight External
    runs-on: ubuntu-latest
    needs: testflight
    environment:
      name: iOS TestFlight
      url: https://testflight.apple.com/join/uA4aHUEx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Add build to external groups and submit for Beta App Review
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RUNWAY_VERSION: ${{ needs.testflight.outputs.version }}
          RUNWAY_BUILD: ${{ needs.testflight.outputs.build }}
        run: node script/testflight_distribute.mjs

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi
