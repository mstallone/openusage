name: Release

# Tag a version to ship it: `git tag v0.7.0 && git push origin v0.7.0`.
# Only stable `vMAJOR.MINOR.PATCH` tags are accepted. The one-time secret/Pages setup is documented
# in the release-swift skill under .agents/skills/release-swift/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.7.0)"
        required: true
        type: string
      force_ios:
        description: "Ship the iOS TestFlight build even when the gate would skip it"
        required: false
        type: boolean
        default: false

# Least privilege by default: only the `release` job writes to GitHub (Release assets, update-feed
# branch, workflow dispatch), and it grants itself what it needs below. The iOS jobs only talk to
# App Store Connect, so they get read-only.
permissions:
  contents: read

# Comma-separated external TestFlight group names every release ships to. The groups must
# already exist under TestFlight → External Testing (one-time setup in the README). Defined once
# here because two jobs must agree on it: distribute adds each build to these groups, and the
# iOS gate treats membership in them as "shipped" when deciding whether a tag needs iOS at all.
env:
  TESTFLIGHT_EXTERNAL_GROUPS: External

jobs:
  release:
    runs-on: macos-26
    # actions: write lets this job dispatch deploy-update-feed.yml the moment the feed is published,
    # instead of waiting for the whole run (the iOS jobs below can keep it open for up to an hour).
    permissions:
      contents: write
      actions: write
    # Serialize update-feed publishers: each release reads the existing appcast, regenerates it with
    # generate_appcast, and force-publishes the backing branch. Without this, two publishers could
    # race and drop a feed entry. Job-level (not workflow-level) so the lock is held only while this
    # job runs — the iOS TestFlight jobs never touch update-feed, and the distribute job can spend
    # up to an hour polling Apple, which must not block pricing-supplement publishes.
    concurrency:
      group: update-feed-publish
      cancel-in-progress: false
    env:
      APPLE_TEAM_ID: 8KZBNZJBAX
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the requested tag. On a tag push `inputs.tag` is empty and checkout defaults to the
          # triggering tag; on workflow_dispatch this pins the tag instead of the default branch.
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # full history so the CFBundleVersion (commit count) is correct
          persist-credentials: true

      - name: Select Xcode
        # The app icon is committed prebuilt (see script/compile_icon.sh) because no actool on GitHub's
        # runners can compile its Liquid Glass `.icon` (Apple regression FB20183399), so the default
        # runner Xcode is fine for the build/sign/notarize steps.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$("$GITHUB_WORKSPACE/script/validate_release_tag.sh" "$TAG")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release tag and required secrets
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_DEVELOPER_ID_ICLOUD_PROFILE: ${{ secrets.APPLE_DEVELOPER_ID_ICLOUD_PROFILE }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for name in \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_PRIVATE_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_DEVELOPER_ID_ICLOUD_PROFILE \
            SPARKLE_PUBLIC_KEY \
            SPARKLE_PRIVATE_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Run tests
        run: swift test

      # Imports the Developer ID cert into a temporary keychain and adds it to the search list (cleaned up
      # automatically in a post step). Replaces a hand-rolled `security create-keychain`/`import` block.
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          # Developer ID Application cert (.p12, base64) used to sign the app and DMG.
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: Resolve signing identity
        run: |
          # The cert is now in the search list; codesign needs the identity's display name.
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity found in the imported cert" >&2; exit 1; }
          [[ "$IDENTITY" == *"($APPLE_TEAM_ID)" ]] \
            || { echo "Developer ID identity does not belong to NextByte team $APPLE_TEAM_ID" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private_key"
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle_ed_private_key" >> "$GITHUB_ENV"

      - name: Write iCloud provisioning profile
        env:
          ICLOUD_PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_ICLOUD_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$ICLOUD_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/runway-icloud.provisionprofile"
          echo "ICLOUD_PROVISIONING_PROFILE=$RUNNER_TEMP/runway-icloud.provisionprofile" >> "$GITHUB_ENV"

      - name: Write App Store Connect notarization key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Carry forward the existing appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # generate_appcast works on a folder: it reads the existing appcast.xml there and the new DMG,
          # then writes a merged appcast. "feed/" is that folder. Seed it with the live appcast so prior
          # versions are preserved (verified: items whose archive isn't in the folder keep their original
          # enclosure URLs untouched).
          mkdir -p feed
          # Distinguish "no update-feed yet" (first release -> fresh feed) from "couldn't read it"
          # (transient failure). Only start fresh when the branch genuinely doesn't exist; otherwise
          # abort so a network blip can't replace the live feed's full history with a single item.
          set +e
          git ls-remote --exit-code --heads origin update-feed >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git fetch origin update-feed
            if git show origin/update-feed:appcast.xml > feed/appcast.xml; then
              echo "Loaded existing appcast from update-feed."
            else
              # `git show > file` creates an empty file even when the source path is absent. Remove it
              # so generate_appcast genuinely starts fresh in the two safe bootstrap states below.
              rm -f feed/appcast.xml

              # Two tags are enough to distinguish an empty fork / first-release retry from real
              # history. A rerun after action-gh-release published the current tag but before the
              # appcast reached update-feed must be recoverable; any other release history still fails
              # closed so a missing feed can never silently discard prior Sparkle entries.
              release_state="$(
                gh release list --limit 2 --json tagName --jq '.[].tagName' \
                  | "$GITHUB_WORKSPACE/script/classify_appcast_bootstrap.sh" "$RELEASE_TAG"
              )"
              case "$release_state" in
                fresh)
                  echo "No prior fork release or appcast — starting a fresh feed."
                  ;;
                retry)
                  echo "Only the partial release for $RELEASE_TAG exists — rebuilding its first appcast."
                  ;;
                history)
                  echo "update-feed has no appcast but prior release history exists — aborting to protect the feed." >&2
                  exit 1
                  ;;
                *)
                  echo "Unexpected appcast bootstrap state: $release_state" >&2
                  exit 1
                  ;;
              esac
            fi
          elif [ "$rc" -eq 2 ]; then
            echo "No update-feed branch yet — starting a fresh feed."
          else
            echo "Could not reach origin to check for update-feed — aborting to protect the feed." >&2
            exit 1
          fi

      - name: Build, sign, and notarize the DMG
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RUNWAY_VERSION: ${{ steps.meta.outputs.version }}
        run: ./script/release.sh

      - name: Publish DMG to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.5
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Runway ${{ steps.meta.outputs.version }}
          prerelease: false
          files: |
            dist/Runway-${{ steps.meta.outputs.version }}.dmg
            dist/Runway-${{ steps.meta.outputs.version }}.dmg.sha256

      - name: Generate appcast with Sparkle
        env:
          DMG: Runway-${{ steps.meta.outputs.version }}.dmg
          # Per-tag GitHub release asset base. generate_appcast applies this prefix only to the new DMG
          # in feed/; preserved items keep their own (older-tag) URLs.
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/
        run: |
          # Locate generate_appcast from the Sparkle SwiftPM artifact that release.sh already fetched.
          GA="$(find .build/artifacts -type f -name generate_appcast 2>/dev/null | head -n1)"
          [ -x "$GA" ] || { echo "generate_appcast not found under .build/artifacts" >&2; exit 1; }

          # How many feed items existed before (to confirm nothing is dropped). 0 on first release.
          # Sparkle normally keeps only a few versions; this release feed is intentionally append-only
          # so older installs remain able to traverse the signed update history.
          before=0
          [ -f feed/appcast.xml ] && before=$(grep -c "<item>" feed/appcast.xml || true)

          cp "dist/$DMG" "feed/$DMG"

          # The key file is base64 (it can contain '/'); pass it via stdin so it's never an argv/glob.
          cat "$SPARKLE_PRIVATE_KEY_FILE" | "$GA" \
            --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            --maximum-versions 0 \
            feed
          "$GITHUB_WORKSPACE/script/normalize_appcast_title.sh" feed/appcast.xml Runway

          # Fail loudly if the merge went wrong. The new DMG's enclosure must exist AND carry an EdDSA
          # signature on the same line (generate_appcast silently omits it if SUPublicEDKey doesn't match
          # the signing key), and the item count must not shrink.
          after=$(grep -c "<item>" feed/appcast.xml || true)
          grep -Eq "$DMG\"[^>]*sparkle:edSignature" feed/appcast.xml \
            || { echo "New item for $DMG is missing or unsigned (SUPublicEDKey/private-key mismatch?)." >&2; exit 1; }
          [ "$after" -ge "$before" ] || { echo "Appcast item count dropped ($before -> $after) — aborting." >&2; exit 1; }
          echo "Appcast OK: $before -> $after items."

      - name: Assemble update feed
        run: |
          mkdir -p public
          cp feed/appcast.xml public/appcast.xml
          # Also publish the current main-branch site content (website + pricing supplement).
          # The content publishers run in their own concurrency group (update-feed-content-
          # publish) so they can never cancel a pending release build; the cost is a seconds-wide
          # window where a content push can race this job's push and fail (non-fast-forward).
          # Shipping the same content union here means the feed still ends up complete even if a
          # content run loses that race, and keep_files above preserves whatever else is live.
          git fetch --depth 1 origin main
          git show FETCH_HEAD:Sources/Runway/Resources/pricing_supplement.json > public/pricing_supplement.json
          git archive FETCH_HEAD website | tar -x -C public --strip-components=1
          # Stamp the mock's footer with the version this run is releasing.
          "$GITHUB_WORKSPACE/script/stamp_website_version.sh" public/index.html "${{ steps.meta.outputs.version }}"

      - name: Publish update feed branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: update-feed
          publish_dir: ./public
          # update-feed also hosts pricing_supplement.json (see pricing-supplement.yml). Without
          # keep_files, publishing the appcast would delete it from the branch.
          keep_files: true

      - name: Deploy update feed now
        env:
          GH_TOKEN: ${{ github.token }}
        # Deploy the live feed immediately: the workflow_run trigger in deploy-update-feed.yml only
        # fires when this whole run completes, and the iOS jobs below can keep the run open for up
        # to an hour — Sparkle clients must not wait on TestFlight polling. workflow_dispatch is one
        # of the two event types GITHUB_TOKEN may trigger, and --ref main is required because the
        # deploy workflow file lives on the default branch, not on this tag. The workflow_run
        # trigger stays as a fallback; a duplicate deploy is an idempotent no-op serialized by the
        # update-feed-deploy concurrency group.
        run: gh workflow run deploy-update-feed.yml --ref main

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/runway-icloud.provisionprofile"
          rm -f "$RUNNER_TEMP/sparkle_ed_private_key"
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi

  # Decides whether this tag needs the iOS TestFlight jobs at all. Every tag is a new marketing
  # version, so every upload triggers a fresh Beta App Review and a no-op update for testers —
  # Mac-only releases skip that. script/testflight_gate.mjs ships when iOS-relevant paths changed
  # since the previous stable tag, when the newest TestFlight upload nears the 90-day expiry, on
  # a first release, or when the force_ios dispatch input is set. Skipping this gate's `ship`
  # output cascades: testflight is conditioned on it, and distribute needs testflight.
  ios-gate:
    name: iOS Gate
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.gate.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # full history + tags so the gate can diff against the previous stable tag
          persist-credentials: false

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          "$GITHUB_WORKSPACE/script/validate_release_tag.sh" "$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Decide whether to ship iOS
        id: gate
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          FORCE_IOS: ${{ inputs.force_ios && '1' || '' }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: node script/testflight_gate.mjs

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi

  # Ships the iOS companion app to TestFlight from the same tag, when the gate above says the
  # release needs it. Independent of the macOS job on purpose: a TestFlight hiccup must not block
  # the DMG/appcast, and vice versa. iOS has no notarization — the App Store Connect upload is the
  # platform's equivalent. Signing is manual with the Apple Distribution cert + App Store profile
  # secrets (an App Manager API key cannot use Xcode cloud signing); the API key only
  # authenticates the upload. The one-time App Store Connect setup is documented in the
  # release-swift skill under .agents/skills/release-swift/.
  testflight:
    name: iOS TestFlight
    runs-on: macos-26
    needs: ios-gate
    if: needs.ios-gate.outputs.ship == 'true'
    env:
      APPLE_TEAM_ID: 8KZBNZJBAX
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0          # full history so the CFBundleVersion (commit count) is correct
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$("$GITHUB_WORKSPACE/script/validate_release_tag.sh" "$TAG")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            # CFBundleVersion, resolved once here so the upload and the distribute job that polls
            # for the processed build can never disagree about which build they mean.
            echo "build=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required secrets
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_IOS_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          APPLE_IOS_WIDGET_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_WIDGET_APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_NOTARY_PRIVATE_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_IOS_APP_STORE_PROFILE \
            APPLE_IOS_WIDGET_APP_STORE_PROFILE
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      # Apple Distribution cert (.p12, base64) used to sign the iOS app. Same action and pattern as
      # the macOS job's Developer ID import: temporary keychain, cleaned up in a post step.
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Write App Store provisioning profiles
        env:
          IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_IOS_WIDGET_APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/runway-ios-appstore.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE=$RUNNER_TEMP/runway-ios-appstore.mobileprovision" >> "$GITHUB_ENV"
          printf '%s' "$IOS_WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision"
          echo "IOS_WIDGET_PROVISIONING_PROFILE=$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and upload to TestFlight
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RUNWAY_VERSION: ${{ steps.meta.outputs.version }}
          RUNWAY_BUILD: ${{ steps.meta.outputs.build }}
        run: ./script/release_ios.sh

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/runway-ios-appstore.mobileprovision"
          rm -f "$RUNNER_TEMP/runway-ios-widgets-appstore.mobileprovision"
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi

  # Distributes the uploaded build to external testers: waits for Apple's processing, adds the
  # build to the external group(s), and submits it for Beta App Review (external testers get it
  # when Apple approves; the internal group already gets every build automatically). A separate
  # job from the upload on purpose — an upload can never be repeated (duplicate build number), but
  # this step is idempotent, so a failure here is retried with `gh run rerun <run-id> --failed`
  # without touching the uploaded build. Linux runner: this only calls the App Store Connect API,
  # no Xcode needed.
  distribute:
    name: TestFlight External
    runs-on: ubuntu-latest
    needs: testflight
    # Record each release as an "iOS TestFlight" deployment so the repository homepage lists the
    # public join link next to the Update Feed deployment. The URL is the External group's public
    # TestFlight invite; it is stable across releases.
    environment:
      name: iOS TestFlight
      url: https://testflight.apple.com/join/uA4aHUEx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Write App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Add build to external groups and submit for Beta App Review
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RUNWAY_VERSION: ${{ needs.testflight.outputs.version }}
          RUNWAY_BUILD: ${{ needs.testflight.outputs.build }}
        run: node script/testflight_distribute.mjs

      - name: Remove release credentials
        if: always()
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          if [[ -n "$APPLE_NOTARY_KEY_ID" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          fi
