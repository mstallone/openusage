# Publishes the landing page to the update feed whenever it changes on main.
#
# The site lives at https://mstallone.github.io/runway/ — the same GitHub Pages origin that serves
# appcast.xml and pricing_supplement.json from the update-feed branch. This workflow publishes
# website/ onto that branch with keep_files, so the page coexists with the feed files and a merge
# to main is all it takes to update the live site.
#
# Concurrency: this workflow and Publish Pricing Supplement share their own content group,
# deliberately NOT the release workflow's update-feed-publish group. GitHub keeps only one PENDING
# run per concurrency group — a newer queued run silently cancels an older pending one even with
# cancel-in-progress: false — and sharing the release group would let a website merge cancel a
# queued release build. Content-on-content supersession is lossless because both content
# publishers ship the UNION of the main-branch content (website/ plus the validated supplement).
# The cost of the separate groups is a seconds-wide window where a content push can race the
# release job's appcast push; the loser fails loudly (non-fast-forward) and a rerun republishes
# everything, and the release job also ships this union so the feed completes either way.
name: Publish Landing Page

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/landing-page.yml
  workflow_dispatch:

concurrency:
  group: update-feed-content-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same gate as pricing-supplement.yml: never ship a supplement that fails validation.
      - name: Validate supplement JSON
        run: |
          python3 - << 'PY'
          import json, re, sys
          with open("Sources/Runway/Resources/pricing_supplement.json") as f:
              supplement = json.load(f)
          problems = []
          for model, entry in supplement["pricing"].items():
              for field in ("input_per_million", "output_per_million"):
                  if not isinstance(entry.get(field), (int, float)):
                      problems.append(f"pricing[{model}].{field} missing or not a number")
          for rule in supplement["alias_rules"]:
              try:
                  re.compile(rule["pattern"])
              except re.error as error:
                  problems.append(f"alias pattern {rule['pattern']!r}: {error}")
              if not rule.get("canonical"):
                  problems.append(f"alias pattern {rule['pattern']!r} has no canonical")
          for model, multiplier in (supplement.get("fast_multipliers") or {}).items():
              if not isinstance(multiplier, (int, float)) or multiplier <= 0:
                  problems.append(f"fast_multipliers[{model}] must be a positive number")
          if problems:
              sys.exit("Supplement validation failed:\n" + "\n".join(problems))
          print(f"Supplement OK: {len(supplement['pricing'])} models, "
                f"{len(supplement['alias_rules'])} alias rules.")
          PY

      # Publish the FULL desired state of the branch instead of layering with keep_files: carry the
      # live appcast forward, then lay down the current main-branch content. Publishing the whole
      # state is what lets a deleted or renamed website file actually disappear from the served
      # site. The branch holds nothing but the appcast, the supplement, and the website.
      #
      # The appcast carry-forward must distinguish "branch does not exist yet" (bootstrap: publish
      # without an appcast) from "could not reach origin" (abort: publishing without the live
      # appcast would delete the Sparkle feed that shipped apps poll). git ls-remote --exit-code
      # returns 2 when the ref is missing and other codes on transport failure.
      - name: Assemble update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public
          set +e
          git ls-remote --exit-code --heads origin update-feed > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth 1 origin update-feed
            if git cat-file -e FETCH_HEAD:appcast.xml 2>/dev/null; then
              git show FETCH_HEAD:appcast.xml > public/appcast.xml
            else
              echo "update-feed exists but has no appcast.xml yet (pre-first-release); continuing."
            fi
          elif [ "$status" -eq 2 ]; then
            echo "update-feed branch does not exist yet; bootstrapping it without an appcast."
          else
            echo "Cannot query origin for the update-feed branch (exit $status); aborting instead of risking the live appcast." >&2
            exit 1
          fi
          cp -R website/. public/
          cp Sources/Runway/Resources/pricing_supplement.json public/pricing_supplement.json
          # Keep the mock's footer on the latest released version instead of whatever the source
          # carried when it was last edited.
          VERSION="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          ./script/stamp_website_version.sh public/index.html "${VERSION#v}"

      - name: Publish update feed branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: update-feed
          publish_dir: ./public
          keep_files: false
