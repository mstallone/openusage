# Publishes the landing page to the update feed whenever it changes on main.
#
# The site lives at https://mstallone.github.io/runway/ — the same GitHub Pages origin that serves
# appcast.xml and pricing_supplement.json from the update-feed branch. This workflow publishes
# website/ onto that branch with keep_files, so the page coexists with the feed files and a merge
# to main is all it takes to update the live site.
#
# Shares the release workflow's concurrency group: everything that pushes to update-feed does so
# with keep_files, so serializing the publishers prevents lost updates from concurrent pushes.
# GitHub keeps only one PENDING run per concurrency group — a newer queued publisher silently
# replaces an older pending one even with cancel-in-progress: false. To make that supersession
# lossless, this workflow and Publish Pricing Supplement each publish the UNION of the main-branch
# content (website/ plus the validated pricing supplement), so whichever run survives ships both.
name: Publish Landing Page

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/landing-page.yml
  workflow_dispatch:

concurrency:
  group: update-feed-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same gate as pricing-supplement.yml: never ship a supplement that fails validation.
      - name: Validate supplement JSON
        run: |
          python3 - << 'PY'
          import json, re, sys
          with open("Sources/Runway/Resources/pricing_supplement.json") as f:
              supplement = json.load(f)
          problems = []
          for model, entry in supplement["pricing"].items():
              for field in ("input_per_million", "output_per_million"):
                  if not isinstance(entry.get(field), (int, float)):
                      problems.append(f"pricing[{model}].{field} missing or not a number")
          for rule in supplement["alias_rules"]:
              try:
                  re.compile(rule["pattern"])
              except re.error as error:
                  problems.append(f"alias pattern {rule['pattern']!r}: {error}")
              if not rule.get("canonical"):
                  problems.append(f"alias pattern {rule['pattern']!r} has no canonical")
          for model, multiplier in (supplement.get("fast_multipliers") or {}).items():
              if not isinstance(multiplier, (int, float)) or multiplier <= 0:
                  problems.append(f"fast_multipliers[{model}] must be a positive number")
          if problems:
              sys.exit("Supplement validation failed:\n" + "\n".join(problems))
          print(f"Supplement OK: {len(supplement['pricing'])} models, "
                f"{len(supplement['alias_rules'])} alias rules.")
          PY

      # Publish the FULL desired state of the branch instead of layering with keep_files: carry the
      # live appcast forward, then lay down the current main-branch content. Publishing the whole
      # state is what lets a deleted or renamed website file actually disappear from the served
      # site. The branch holds nothing but the appcast, the supplement, and the website, and the
      # shared concurrency group serializes publishers, so the carry-forward cannot race a release.
      - name: Assemble update feed
        run: |
          mkdir -p public
          if git fetch --depth 1 origin update-feed 2>/dev/null; then
            git show FETCH_HEAD:appcast.xml > public/appcast.xml 2>/dev/null || rm -f public/appcast.xml
          fi
          cp -R website/. public/
          cp Sources/Runway/Resources/pricing_supplement.json public/pricing_supplement.json

      - name: Publish update feed branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: update-feed
          publish_dir: ./public
          keep_files: false
